server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/feedrank}
    username: ${DATABASE_USER:feedrank}
    password: ${DATABASE_PASSWORD:feedrank}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: false

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-to-a-long-random-secret-at-least-32-bytes!!}
    expiration-ms: 86400000
  ingestion:
    enabled: ${INGESTION_ENABLED:true}
    cron-fixed-delay-ms: 900000
    max-items-per-run: 60
    seed-on-startup: true
  ranking:
    mode: ${RANKING_MODE:tag}
    recency-half-life-hours: 48
    exploration-epsilon: 0.1
  embeddings:
    provider: ${EMBEDDING_PROVIDER:hash}
    model: ${EMBEDDING_MODEL:text-embedding-004}
    dimension: 768
    groq-api-key: ${GROQ_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}

logging:
  level:
    com.feedrank: INFO
