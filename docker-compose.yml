services:
  db:
    image: pgvector/pgvector:pg16
    container_name: feedrank-db
    environment:
      POSTGRES_DB: feedrank
      POSTGRES_USER: feedrank
      POSTGRES_PASSWORD: feedrank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedrank"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: feedrank-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/feedrank
      DATABASE_USER: feedrank
      DATABASE_PASSWORD: feedrank
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-random-secret-at-least-32-bytes!!}
      RANKING_MODE: ${RANKING_MODE:-tag}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: feedrank-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
